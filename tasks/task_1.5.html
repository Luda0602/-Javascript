<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задача 5</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page">
      <a href="../index.html" class="back">← Назад</a>

      <div class="card">
        <h1>Задача 5</h1>

        <p class="description">
          Дано масив чисел. Створи новий масив, де кожне число помножене на 2:
          let arr = [3, 5, 7, 2];
        </p>
      </div>
    </div>
    <script>
      let arr = [3, 5, 7, 2];
      let newArray = arr.map((num) => num * 2);
      document.write(newArray);
    </script>
  </body>
</html>
