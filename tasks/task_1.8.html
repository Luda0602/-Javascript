<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <div class="page">
      <a href="../index.html" class="back">← Назад</a>

      <div class="card">
        <h1>Задача 6</h1>

        <p class="description">
          Знайди середнє значення всіх чисел масиву: let arr = [2, 4, 6, 8];
        </p>
      </div>
    </div>
    <script>
      let arr = [2, 4, 6, 8];
      let result = arr.reduce((acc, num) => acc + num, 0);
      let average = result / arr.length;
      document.write(average);
    </script>
  </body>
