<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задача 6</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page">
      <a href="../index.html" class="back">← Назад</a>

      <div class="card">
        <h1>Задача 6</h1>

        <p class="description">
          Дано масив чисел: let arr = [1, 2, 3, 4, 5]; Залиш тільки числа більші
          за 2 Потім помнож їх на 3
        </p>
      </div>
    </div>
    <script>
      let arr = [1, 2, 3, 4, 5];
      let result = arr.filter((num) => num < 6).map((num) => num + 5);
      document.write(result);
    </script>
  </body>
</html>
