  <body>
    <div class="page">

      <div class="card">
        <h1>Задача 6</h1>

        <p class="description">
          Знайди середнє значення всіх чисел масиву: let arr = [2, 4, 6, 8];
        </p>
      </div>
    </div>
    <script>
      let userEmail = prompt("Введіть email", "");
      if (userEmail === "user@gmail.com") {
        let password = prompt("Введіть пароль", "");
        if (password === "12345") {
          alert("Вхід успішний");
        } else if (password === " " || password === null) {
          alert("Скасовано");
        } else {
          alert("Неправльний пароль");
        }
      } else if (userEmail === "admin@gmail.com" && password === "admin123") {
        alert("Ви увійшли як адміністратор");
      } else {
        alert("Користувача не знайдено");
      }
    </script>
  </body>
